<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Pantry Matcher</title>
  <style>
    :root {
      --primary: #e65100;
      --primary-light: #fff3e0;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.25rem 1rem 3rem 1rem;
      max-width: 640px;
      margin: auto;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 0.35rem;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .actions {
      margin: 0.75rem 0 1.25rem 0;
      display: flex;
      gap: 0.5rem;
    }

    button {
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text);
      transition: background 0.15s ease;
    }

    button:hover {
      background: #f1f5f9;
    }

    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.5rem;
      max-height: 220px;
      overflow-y: auto;
      padding: 0.5rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .chip {
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.82rem;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .category-heading {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      margin: 1.5rem 0 0.5rem 0;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .category-heading:first-child {
      margin-top: 0.5rem;
    }

    .recipe-card {
      background: var(--card);
      border-radius: 10px;
      padding: 0.9rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .recipe-card:hover {
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.07);
    }

    .recipe-title {
      font-weight: 700;
      font-size: 0.98rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-tag {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-left: 0.35rem;
    }

    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.ready {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.missing {
      background: #fef3c7;
      color: #b45309;
    }

    .badge.count {
      background: #f1f5f9;
      color: #475569;
    }

    .ingredient-summary {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      line-height: 1.3;
    }

    .steps {
      font-size: 0.82rem;
      color: #334155;
      margin-top: 0.6rem;
      border-top: 1px dashed var(--border);
      padding-top: 0.6rem;
      line-height: 1.45;
      display: none;
    }

    .steps.open {
      display: block;
    }

    .hint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <h1>🍳 Kitchen Pantry Matcher</h1>
  <p class="subtitle">Tap ingredients you have to prioritize ready-to-make meals.</p>

  <div class="actions">
    <button onclick="clearAll()">Clear Checked</button>
    <button onclick="fetchData()">🔄 Reload Sheet</button>
  </div>

  <strong>Pantry Ingredients</strong>
  <div id="ingredientChips" class="chips-container">Loading pantry items...</div>

  <div class="section-header">
    <strong style="font-size: 1.05rem;">Suggested Recipes</strong>
    <span id="recipeCount" style="font-size: 0.8rem; color: var(--text-muted);"></span>
  </div>

  <div id="recipeResults">Connecting to Google Sheet...</div>

  <script>
    // Direct CSV endpoint derived from your published sheet URL
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR4IXeiYmaiaZ8cBF435gRbIy2Y7np9MEWfyza28HLDmo0lKPgMTiDppcISgsKQjAEarVygSjoclEon/pub?output=csv";

    let recipes = [];
    let allIngredients = new Set();
    let selected = new Set(JSON.parse(localStorage.getItem("pantry_items") || "[]"));

    async function fetchData() {
      const resultsContainer = document.getElementById("recipeResults");
      try {
        resultsContainer.innerText = "Loading latest recipes...";
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const text = await res.text();
        parseCSV(text);
      } catch (err) {
        resultsContainer.innerHTML = 
          "<p style='color:red;'>Could not read sheet data. Make sure the sheet is published as CSV and accessible.<br><small>" + err + "</small></p>";
      }
    }

    function parseCSV(csvText) {
      const rows = csvText.split('\n').map(r => r.trim()).filter(r => r.length > 0);
      recipes = [];
      allIngredients.clear();

      for (let i = 1; i < rows.length; i++) {
        // Parse CSV fields supporting quoted strings
        const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"\vert{}"$/g, '').trim());
        if (cols.length >= 3) {
          const name = cols[0];
          const category = cols[1] || "General";
          const ingList = cols[2].split(',').map(item => item.trim()).filter(Boolean);
          const steps = cols[3] || "No instructions provided.";
          
          ingList.forEach(ing => allIngredients.add(ing));
          recipes.push({ name, category, core: ingList, steps });
        }
      }

      renderChips();
      renderMatches();
    }

    function renderChips() {
      const box = document.getElementById("ingredientChips");
      box.innerHTML = "";
      
      const sortedIngredients = [...allIngredients].sort((a, b) => a.localeCompare(b));

      sortedIngredients.forEach(item => {
        const chip = document.createElement("div");
        chip.className = `chip ${selected.has(item) ? "active" : ""}`;
        chip.innerText = item;
        chip.onclick = () => {
          if (selected.has(item)) {
            selected.delete(item);
          } else {
            selected.add(item);
          }
          localStorage.setItem("pantry_items", JSON.stringify([...selected]));
          chip.classList.toggle("active");
          renderMatches();
        };
        box.appendChild(chip);
      });
    }

    function clearAll() {
      selected.clear();
      localStorage.setItem("pantry_items", "[]");
      renderChips();
      renderMatches();
    }
function renderMatches() {
      const out = document.getElementById("recipeResults");
      out.innerHTML = "";

      // 1. Calculate matching and missing ingredients for each recipe
      const ranked = recipes.map(r => {
        // How many of your selected items does this recipe actually use?
        const matched = r.core.filter(i => selected.has(i));
        // How many required items are you still missing?
        const missing = r.core.filter(i => !selected.has(i));
        return { ...r, matched, missing };
      });

      if (selected.size > 0) {
        // FILTER: Only show recipes that use AT LEAST ONE of your selected ingredients
        const filtered = ranked.filter(r => r.matched.length > 0);

        // SORTING:
        // 1. Most matched items first (e.g. uses 2 of your items before 1)
        // 2. Fewest missing items second (closer to completion)
        // 3. Category alphabetically
        // 4. Name alphabetically
        filtered.sort((a, b) => {
          if (b.matched.length !== a.matched.length) {
            return b.matched.length - a.matched.length;
          }
          if (a.missing.length !== b.missing.length) {
            return a.missing.length - b.missing.length;
          }
          if (a.category !== b.category) {
            return a.category.localeCompare(b.category);
          }
          return a.name.localeCompare(b.name);
        });

        // Render matched results
        filtered.forEach(r => {
          const isReady = r.missing.length === 0;
          const card = document.createElement("div");
          card.className = "recipe-card";

          const badgeHtml = isReady 
            ? `<span class="badge ready">Ready</span>` 
            : `<span class="badge missing">Need ${r.missing.length}</span>`;

          const tagHtml = isReady 
            ? `<span style="color: #15803d; font-weight: 500;">✓ All ingredients on hand</span>`
            : `Uses: <strong>${r.matched.join(", ")}</strong> | Missing: ${r.missing.join(", ")}`;

          card.innerHTML = `
            <div class="recipe-title">
              <span>${r.name} <span class="category-tag">(${r.category})</span></span>
              ${badgeHtml}
            </div>
            <div class="ingredient-summary">${tagHtml}</div>
            <div class="hint">Tap to show/hide recipe steps</div>
            <div class="steps">${r.steps}</div>
          `;

          card.onclick = () => {
            const stepsEl = card.querySelector(".steps");
            stepsEl.classList.toggle("open");
          };

          out.appendChild(card);
        });

        document.getElementById("recipeCount").innerText = `${filtered.length} matching dishes`;

      } else {
        // WHEN NOTHING IS SELECTED:
        // Group and sort everything purely by Category, then Name
        ranked.sort((a, b) => {
          if (a.category !== b.category) {
            return a.category.localeCompare(b.category);
          }
          return a.name.localeCompare(b.name);
        });

        let currentCategory = "";

        ranked.forEach(r => {
          if (r.category !== currentCategory) {
            currentCategory = r.category;
            const catHeader = document.createElement("div");
            catHeader.className = "category-heading";
            catHeader.innerText = currentCategory;
            out.appendChild(catHeader);
          }

          const card = document.createElement("div");
          card.className = "recipe-card";
          card.innerHTML = `
            <div class="recipe-title">
              <span>${r.name} <span class="category-tag">(${r.category})</span></span>
              <span class="badge count">${r.core.length} ingredients</span>
            </div>
            <div class="ingredient-summary">Requires: ${r.core.join(", ")}</div>
            <div class="hint">Tap to show/hide recipe steps</div>
            <div class="steps">${r.steps}</div>
          `;

          card.onclick = () => {
            const stepsEl = card.querySelector(".steps");
            stepsEl.classList.toggle("open");
          };

          out.appendChild(card);
        });

        document.getElementById("recipeCount").innerText = `${recipes.length} of ${recipes.length} dishes`;
      }
    }
    // Initialize on page load
    fetchData();
  </script>
</body>
</html>
